spring.application.name=boarding-house-management

# Configure these environment variables after creating the application database/user.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/boarding_house_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:boarding_house_app}
spring.datasource.password=${DB_PASSWORD:change-me}

# Database objects are deliberately not created or modified automatically.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Keep development errors readable without exposing detailed errors to users.
server.error.include-message=never
server.error.include-stacktrace=never
